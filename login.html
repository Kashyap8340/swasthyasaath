<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - SwasthyaSaathi AI</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-background-light font-sans text-foreground min-h-screen flex items-center justify-center p-4">
    
    <div class="max-w-5xl w-full bg-soft-clay rounded-[3rem] border border-border-color shadow-soft-lg overflow-hidden flex flex-col md:flex-row-reverse relative z-10">
        
        <!-- Right Side: Botanical Form -->
        <div class="w-full md:w-1/2 p-10 lg:p-16 flex flex-col justify-center">
            <a href="index.html" class="flex items-center gap-2 mb-12 w-max text-primary hover:text-foreground transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="text-sm font-bold uppercase tracking-widest">Back to Home</span>
            </a>

            <h1 class="text-4xl lg:text-5xl font-serif font-bold italic mb-4">Welcome Back</h1>
            <p class="text-foreground/70 mb-10 text-lg">Log in to continue your personalized health journey.</p>

            <form id="loginForm" class="space-y-6">
                <div id="errorBox" class="hidden bg-terracotta/10 text-terracotta p-4 rounded-2xl text-sm border border-terracotta/20"></div>

                <div>
                    <label class="block text-sm font-bold uppercase tracking-widest text-foreground/80 mb-2">Email Address</label>
                    <input type="email" id="email" required placeholder="aarav@example.com"
                        class="w-full bg-background-light border border-border-color rounded-full px-6 py-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-foreground">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-bold uppercase tracking-widest text-foreground/80">Password</label>
                        <a href="#" class="text-xs text-primary hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full bg-background-light border border-border-color rounded-full px-6 py-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-foreground">
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-foreground/60 hover:text-primary transition-colors" onclick="togglePassword('password', 'eyeIcon')">
                            <span class="material-symbols-outlined" id="eyeIcon">visibility</span>
                        </button>
                    </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-primary text-white font-bold uppercase tracking-widest py-4 rounded-full shadow-soft hover:shadow-soft-md hover:-translate-y-1 transition-all duration-300 mt-4 flex justify-center items-center gap-2">
                    <span>Log In</span>
                    <span class="material-symbols-outlined text-sm">login</span>
                </button>
            </form>

            <div class="relative mt-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-border-color"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-soft-clay text-foreground/60">Or continue with</span>
                </div>
            </div>

            <div class="mt-6 flex justify-center">
                <div id="g_id_onload"
                     data-client_id="330878158661-44c0s17o5ej04sf4a7hgfqhjgoid73j1.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleCallback"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>

            <p class="mt-8 text-center text-foreground/60">
                Don't have an account yet? 
                <a href="signup.html" class="text-primary font-bold hover:underline">Sign Up</a>
            </p>
        </div>

        <!-- Left Side: Image Arch -->
        <div class="w-full md:w-1/2 bg-secondary relative hidden md:block overflow-hidden p-6">
            <div class="w-full h-full rounded-t-full rounded-b-[40px] overflow-hidden relative">
                <img src="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&q=80" 
                     alt="Botanical" class="object-cover object-bottom w-full h-full opacity-90 scale-105 hover:scale-100 transition-transform duration-[2000ms]">
                <div class="absolute inset-0 bg-primary/10 mix-blend-multiply"></div>
            </div>
        </div>
    </div>

    <script>
        async function handleGoogleCallback(response) {
            const errorBox = document.getElementById('errorBox');
            errorBox.classList.add('hidden');
            
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Google login failed');
                
                localStorage.setItem('swasthyasaathi_token', data.token);
                localStorage.setItem('swasthyasaathi_user', JSON.stringify(data.user));
                window.location.href = 'chat.html';
                
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            }
        }

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
            submitBtn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error || 'Failed to log in');
                
                // Store JWT token
                localStorage.setItem('swasthyasaathi_token', data.token);
                localStorage.setItem('swasthyasaathi_user', JSON.stringify(data.user));
                
                // Redirect to chat
                window.location.href = 'chat.html';
                
            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                submitBtn.innerHTML = '<span>Log In</span><span class="material-symbols-outlined text-sm">login</span>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
